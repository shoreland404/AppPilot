[package]
name = "app"
version = "0.2.0"
description = "AppPilot desktop application manager"
authors = ["shoreland404"]
license = "MIT"
repository = "https://github.com/shoreland404/AppPilot"
edition = "2021"
rust-version = "1.90"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dirs = "5.0"
tauri = { version = "2.12.5", features = [] }
tauri-plugin-log = "2"
